asília`,shortName:`Rodoferroviária`,architect:`Lúcio Costa & Sérgio Bernardes`,year:`1981`,subtitle:`Marco Zero Oeste do Eixo Monumental & Parque Ferroviário`,description:`Ponto de partida oeste do Eixo Monumental! Inaugurada em 1981 com linhas brutalistas horizontais monumentais, plataformas suspensas de concreto aparente e a grande rotatória oeste.`,position:{x:-1545,y:0,z:0},cameraPos:{x:-1410,y:42,z:95},cameraLookAt:{x:-1545,y:12,z:0},triggerRadius:150,color:`#f59e0b`},{id:`memorial_jk`,name:`Memorial JK`,shortName:`Memorial JK`,architect:`Oscar Niemeyer`,year:`1981`,subtitle:`Mausoléu e Museu do fundador Presidente Juscelino Kubitschek`,description:`Monumento em mármore branco dedicado ao presidente que construiu Brasília no coração do Cerrado. No topo da torre em forma de foice/concha de 28 metros repousa a estátua de JK acenando para sua criação.`,position:{x:-1180,y:.5,z:-5},cameraPos:{x:-1115,y:34,z:75},cameraLookAt:{x:-1180,y:16,z:-5},triggerRadius:135,color:`#fbbf24`},{id:`rainha_da_paz`,name:`Paróquia Militar Rainha da Paz`,shortName:`Rainha da Paz`,architect:`Oscar Niemeyer`,year:`1991`,subtitle:`Catedral Militar em forma de tenda triangular modernista`,description:`Projetada por Oscar Niemeyer com a silhueta pura de uma barraca militar estilizada em concreto branco na Via N1, acompanhada por seu campanário escultural e vitral em cruz.`,position:{x:-965,y:2,z:-122},cameraPos:{x:-925,y:30,z:-55},cameraLookAt:{x:-965,y:14,z:-122},triggerRadius:125,color:`#38bdf8`},{id:`catedral_militar_cruz`,name:`Praça do Cruzeiro & Cruz de Brasília`,shortName:`Praça do Cruzeiro`,architect:`Lúcio Costa`,year:`1957`,subtitle:`Ponto mais alto do Eixo Monumental (1.172m) & Local da 1ª Missa`,description:`O mirante natural mais alto do Eixo Monumental! Aqui foi celebrada a primeira missa de Brasília em 3 de maio de 1957. Oferece a vista panorâmica mais famosa do pôr do sol sobre toda a Esplanada.`,position:{x:-820,y:3.5,z:0},cameraPos:{x:-770,y:36,z:70},cameraLookAt:{x:-820,           <span id="bsb-min-south">S1 ➡️</span>
        </div>
      </div>
    </section>

    <!-- CENTER BANNER -->
    <div class="bsb-center-banner">
      <div class="bsb-countdown-text" id="bsb-countdown-text"></div>
    </div>

    <!-- SPEEDOMETER -->
    <section class="bsb-speedo-panel bsb-glass bsb-interactive">
      <div class="bsb-speed-readout">
        <div class="bsb-speed-num" id="bsb-speed-val">0</div>
        <div class="bsb-speed-unit">
          <span>KM/H</span>
          <span class="bsb-gear-badge" id="bsb-gear-val">1ª</span>
        </div>
      </div>

      <div class="bsb-bars-col">
        <div class="bsb-bar-track">
          <div class="bsb-bar-fill" id="bsb-drift-bar" style="background:linear-gradient(90deg,#38bdf8,#a855f7);"></div>
        </div>
      </div>

      <button class="bsb-nitro-btn" id="bsb-btn-nitro">🔥 NITRO</button>
    </section>

    <!-- INTERACTIVE AVIÃO MINIMAP -->
    <section class="bsb-minimap-card bsb-glass bsb-interactive" id="bsb-minimap-card">
      <div class="bsb-minimap-header">
        <span>✈️ MAPA DO AVIÃO (PLANO PILOTO)</span>
        <button id="bsb-map-close" style="border:none;background:transparent;color:#facc15;font-weight:900;cursor:pointer;">✕</button>
      </div>
      <div class="bsb-minimap-canvas-wrap">
        <canvas id="bsb-minimap-canvas" width="290" height="138" style="width:100%;height:100%;display:block;"></canvas>
      </div>
    </section>

    <!-- MOBILE TOUCH GAMEPAD -->
    <div class="bsb-mobile-controls" id="bsb-mobile-controls">
      <div class="bsb-mobile-cluster">
        <button class="bsb-touch-btn" data-touch-ctrl="left">◀<span>ESQ</span></button>
        <button class="bsb-touch-btn" data-touch-ctrl="right">▶<span>DIR</span></button>
      </div>

      <div style="display:flex;flex-direction:column;align-items:flex-end;">
        <button class="bsb-touch-btn bsb-touch-item" id="bsb-touch-use-item">
          <span id="bsb-touch-item-icon" style="font-size:22px;color:#fff;">🎲</span>
          <span>PODER</span>
        </button>
        <div class="bsb-mobile-cluster">
          <button class="bsb-touch-btn" data-touch-ctrl="down" style="width:52px;height:52px;">⏪<span>RÉ</span></button>
          <button class="bsb-touch-btn bsb-touch-drift" data-touch-ctrl="drift">⚡<span>DRIFT</span></button>
          <button class="bsb-touch-btn bsb-touch-gas" data-touch-ctrl="up">🚀<span>ACELERA</span></button>
        </div>
      </div>
    </div>

    <!-- DESKTOP BOTTOM TELEPORT BAR -->

    <!-- SETTINGS & GARAGE MODAL -->
    <div class="bsb-modal-backdrop bsb-interactive hidden" id="bsb-menu-modal">

          <h2 style="margin:0;font-size:20px;font-weight:900;color:#facc15;">⚙️ Menu Brasília 3D</h2>
          <button class="bsb-mobile-btn" id="bsb-menu-close">✕ Fechar</button>
